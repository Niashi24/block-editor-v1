[package]
name = "block-editor-v1"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20", features = ["bevy_dev_tools", "bevy_camera_controller", "free_camera", "pan_camera", "debug", "render_dev_tools"] }
bytemuck = "1.25.0"
gltf-json = { version = "1.4.1", features = ["KHR_texture_transform"] }
wgpu-types = { version = "30.0", default-features = false }
snafu = "0.9.0"
serde = { version = "1.0.228", features = ["serde_derive"] }
parry3d = "0.26.1"
ron = "0.12.1"
iddqd = "0.4.2"
tiny_bail = "0.7.0"
typetag = "0.2.23"
toml = "1.1.8"
rfd = "0.17.2"
crossbeam-channel = "0.5.17"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

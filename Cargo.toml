[package]
name = "block-editor-v1"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.0-rc.1", features = ["bevy_dev_tools", "bevy_camera_controller", "free_camera", "pan_camera", "debug"] }
bytemuck = "1.25.0"
gltf-json = { version = "1.4.1", features = ["KHR_texture_transform"] }
wgpu-types = { version = "29.0.3", default-features = false }
snafu = "0.9.0"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["serde_derive"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
